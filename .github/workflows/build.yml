name: Build Binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 openpyxl pandas numpy matplotlib pyinstaller
      - name: Build Linux binary
        run: |
          pyinstaller --onefile --windowed --name ExcelDataAutomation main.py
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcelDataAutomation-linux
          path: dist/ExcelDataAutomation

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 openpyxl pandas numpy matplotlib pyinstaller
      - name: Build Windows binary
        run: |
          pyinstaller --onefile --windowed --name ExcelDataAutomation main.py
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcelDataAutomation-windows
          path: dist/ExcelDataAutomation.exe
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ExcelDataAutomation.exe
